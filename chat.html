<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>原生聊天</title>
<link rel="stylesheet" href="kimi-theme.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { overflow: hidden; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* 内容列：居中、限宽 768px、左右留白 16px */
  .col {
    width: 100%;
    max-width: 768px;
    margin: 0 auto;
    padding-left: 16px;
    padding-right: 16px;
  }

  /* ---------- 顶部状态条 ---------- */
  .statusbar { flex: none; padding: 10px 0; }
  .statusbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    color: var(--label-tertiary);
  }
  .status-left { display: flex; align-items: center; gap: 8px; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.connecting { background: var(--label-quaternary); animation: breathe 1.4s ease-in-out infinite; }
  .dot.ready { background: var(--color-success); }
  .dot.busy { background: var(--color-success); animation: breathe 1.4s ease-in-out infinite; }
  .dot.error { background: var(--color-error); }
  .dot.exited { background: var(--label-quaternary); }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  .status-right {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
  }
  .status-right span { overflow: hidden; text-overflow: ellipsis; }
  .mono { font-family: var(--font-mono); }

  /* Web UI 降级入口：状态条右侧小号描边按钮 */
  .webui-btn {
    flex: none;
    padding: 2px 10px;
    border: 1px solid var(--separator);
    border-radius: 6px;
    background: transparent;
    color: var(--label-tertiary);
    font-family: inherit;
    font-size: 12px;
    line-height: 1.5;
    cursor: pointer;
  }
  .webui-btn:hover { color: var(--label-primary); border-color: var(--separator-hover); }

  /* ---------- 会话信息行：恢复会话时展示会话名与工作目录，缺省隐藏 ---------- */
  .sessionbar {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 6px;
    font-size: 12px;
    color: var(--label-tertiary);
    min-width: 0;
  }
  .sessionbar[hidden] { display: none; }
  .session-title {
    flex: none;
    max-width: 50%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--label-secondary);
  }
  .session-workdir {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---------- 配置切换栏：模型/思考/模式三个下拉，数据来自 configOptions ---------- */
  .configbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 2px 0 8px;
    font-size: 12px;
    color: var(--label-tertiary);
  }
  .configbar[hidden] { display: none; }
  .config-item { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .config-item[hidden] { display: none; }
  .config-label { flex: none; }
  .config-select {
    max-width: 180px;
    padding: 3px 6px;
    border: 1px solid var(--separator);
    border-radius: 6px;
    background: var(--bg-secondary);
    color: var(--label-primary);
    font-family: inherit;
    font-size: 12px;
    outline: none;
  }
  .config-select:focus { border-color: var(--label-quaternary); }
  .config-select:disabled { color: var(--label-tertiary); opacity: 0.4; }

  /* ---------- 消息列表 ---------- */
  .messages { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .messages-inner {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-top: 8px;
    padding-bottom: 20px;
  }

  /* 用户消息：右侧气泡 */
  .msg-user {
    align-self: flex-end;
    max-width: 75%;
    padding: 10px 14px;
    background: var(--bg-secondary);
    border: 1px solid var(--separator);
    border-radius: var(--radius-card);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 用户消息内图片：缩略图行 + 文本块（chat.js 带图发送时渲染 .msg-images/.msg-image-thumb/.msg-user-text） */
  .msg-images {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 6px;
  }
  .msg-images:last-child { margin-bottom: 0; }
  .msg-image-thumb {
    display: block;
    max-width: 160px;
    max-height: 160px;
    object-fit: cover;
    border-radius: 6px;
  }

  /* assistant 消息：左侧无气泡纯文本 */
  .msg-assistant { align-self: stretch; min-width: 0; }
  .assistant-text {
    color: var(--label-primary);
    font-size: 16px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 每轮思考：折叠区，有内容时才展示 */
  .thought { margin-bottom: 8px; }
  .thought summary {
    display: inline-flex;
    align-items: center;
    font-size: 12.5px;
    color: var(--label-tertiary);
    cursor: pointer;
    user-select: none;
  }
  .thought-body {
    margin-top: 6px;
    max-height: 240px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--label-tertiary);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ---------- 工具调用卡片：左侧 2px 色条 + 等宽小字，状态点复用 .dot 色系 ---------- */
  .tool-card {
    margin: 8px 0;
    padding: 8px 12px;
    border-left: 2px solid var(--label-quaternary);
    border-radius: 8px;
    background: var(--bg-secondary);
    font-size: 12.5px;
    color: var(--label-secondary);
  }
  .tool-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tool-dot { width: 6px; height: 6px; }
  .tool-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--label-primary);
  }
  .tool-kind {
    flex: none;
    padding: 1px 6px;
    border: 1px solid var(--separator);
    border-radius: 6px;
    font-size: 11px;
    color: var(--label-tertiary);
  }
  .tool-status { flex: none; font-size: 11.5px; color: var(--label-tertiary); }
  .tool-detail summary {
    display: inline-flex;
    align-items: center;
    margin-top: 6px;
    font-size: 12px;
    color: var(--label-tertiary);
    cursor: pointer;
    user-select: none;
  }
  .tool-detail-body,
  .tool-output {
    margin-top: 6px;
    max-height: 200px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--label-tertiary);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 系统提示（如权限请求取消、发送失败） */
  .msg-system {
    align-self: stretch;
    text-align: center;
    font-size: 12px;
    color: var(--label-tertiary);
  }

  /* ---------- 底部输入区 ---------- */
  .bottom { flex: none; padding: 8px 0 16px; }

  /* 错误提示条：输入区上方 */
  .error-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--color-error);
  }
  .error-bar[hidden] { display: none; }
  .error-text { flex: 1; min-width: 0; word-break: break-word; line-height: 1.5; }
  .error-bar .btn { flex: none; padding: 4px 14px; font-size: 12px; }

  /* 输入容器：对齐官网 .chat-editor-content；position:relative 作为斜杠菜单浮层定位基准 */
  .composer {
    position: relative;
    background: var(--bg-secondary);
    border: 1px solid var(--separator);
    border-radius: var(--radius-input);
    box-shadow: var(--shadow-card);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .composer:focus-within { border-color: var(--label-quaternary); }
  .composer textarea {
    width: 100%;
    min-height: 24px;
    max-height: 170px;
    padding: 0;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--label-primary);
    font-family: inherit;
    font-size: 16px;
    line-height: 24px;
    overflow-y: hidden;
  }
  .composer textarea::placeholder { color: var(--label-quaternary); }
  .composer textarea:disabled { color: var(--label-tertiary); }

  /* 附件缩略图行：textarea 上方，chat.js 动态创建 .chip（img 缩略图 + .chip-remove 移除钮） */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chips[hidden] { display: none; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px;
    background: var(--bg-tertiary);
    border: 1px solid var(--separator);
    border-radius: 8px;
  }
  .chip img {
    display: block;
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 6px;
  }
  .chip-remove {
    flex: none;
    width: 20px;
    height: 20px;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--label-tertiary);
    font-family: inherit;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .chip-remove:hover { color: var(--label-primary); }

  /* 斜杠命令浮层：绝对定位于输入容器上方，chat.js 往其中渲染 button.slash-item，高亮态加 .active */
  .slash-menu {
    position: absolute;
    bottom: 100%;
    left: 0;
    right: 0;
    z-index: 10;
    margin-bottom: 6px;
    max-height: 260px;
    overflow-y: auto;
    padding: 4px;
    background: var(--bg-tertiary);
    border: 1px solid var(--separator);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
  }
  .slash-menu[hidden] { display: none; }
  .slash-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    padding: 8px 12px;
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    font-size: 13px;
    color: var(--label-primary);
  }
  .slash-item:hover,
  .slash-item.active { background: var(--bg-tertiary-hover); }
  .slash-name {
    flex: none;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--label-primary);
  }
  .slash-desc {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    color: var(--label-tertiary);
  }
  .slash-hint {
    flex: none;
    max-width: 40%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--label-quaternary);
  }

  .composer-actions { display: flex; align-items: center; justify-content: space-between; }

  /* 圆形附件按钮：发送按钮左侧，透明底，仅图标着色 */
  .attach {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--label-tertiary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .attach:not(:disabled):hover { color: var(--label-primary); }
  .attach:disabled { opacity: 0.4; cursor: default; }

  /* 圆形发送按钮：亮色下深底浅箭头，暗色下随令牌自动反转 */
  .send {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: var(--label-primary);
    color: var(--bg-ground);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .send:not(:disabled):hover { opacity: 0.85; }
  .send:disabled { opacity: 0.4; cursor: default; }
  /* busy 态停止按钮：同一节点换文案，由圆形变为胶囊 */
  .send.stop-mode { width: auto; height: 32px; padding: 0 12px; border-radius: var(--radius-pill); font-size: 13px; }
  .send-stop { white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .dot.connecting, .dot.busy { animation: none; }
    .send { transition: none; }
  }
</style>
</head>
<body>
  <!-- 无边框窗口顶部拖拽条（样式见 kimi-theme.css #kcd-drag-strip） -->
  <div id="kcd-drag-strip" aria-hidden="true"></div>
  <div class="app">
    <!-- 顶部状态条 -->
    <header class="statusbar">
      <div class="col statusbar-row">
        <div class="status-left">
          <span class="dot connecting" id="statusDot" aria-hidden="true"></span>
          <span id="statusText">正在连接…</span>
        </div>
        <div class="status-right">
          <span id="agentInfo" hidden></span>
          <span id="sessionInfo" class="mono" hidden></span>
          <span id="commandsInfo" hidden></span>
          <button class="webui-btn" id="webuiBtn" type="button" title="在 Web UI 高级面板中打开">Web UI</button>
        </div>
      </div>
      <!-- 会话信息行：恢复会话时展示，缺省隐藏 -->
      <div class="col sessionbar" id="sessionBar" hidden>
        <span class="session-title" id="sessionTitle" hidden></span>
        <span class="session-workdir mono" id="workDir" hidden></span>
      </div>
      <!-- 配置切换栏：模型/思考/模式，数据来自 configOptions，某项缺失则隐藏对应项 -->
      <div class="col configbar" id="configBar" hidden>
        <label class="config-item" id="configItem-model" hidden>
          <span class="config-label">模型</span>
          <select class="config-select" id="configSelect-model" aria-label="模型"></select>
        </label>
        <label class="config-item" id="configItem-thinking" hidden>
          <span class="config-label">思考</span>
          <select class="config-select" id="configSelect-thinking" aria-label="思考"></select>
        </label>
        <label class="config-item" id="configItem-mode" hidden>
          <span class="config-label">模式</span>
          <select class="config-select" id="configSelect-mode" aria-label="模式"></select>
        </label>
      </div>
    </header>

    <!-- 消息列表 -->
    <main class="messages" id="messages">
      <div class="col messages-inner" id="messagesInner"></div>
    </main>

    <!-- 底部：错误提示条 + 输入区 -->
    <footer class="bottom">
      <div class="col bottom-inner">
        <div class="error-bar" id="errorBar" hidden>
          <span class="error-text" id="errorText" role="alert"></span>
          <button class="btn btn-secondary" id="retryBtn" type="button">重试</button>
        </div>
        <div class="composer">
          <!-- 斜杠命令浮层：chat.js 渲染 button.slash-item，缺省隐藏 -->
          <div class="slash-menu" id="slashMenu" hidden></div>
          <!-- 附件缩略图行：chat.js 创建 .chip，缺省隐藏 -->
          <div class="chips" id="chips" hidden></div>
          <textarea id="input" rows="1" placeholder="给 Kimi 发送消息，Enter 发送，Shift+Enter 换行" aria-label="消息输入框" spellcheck="false" disabled></textarea>
          <div class="composer-actions">
            <button class="attach" id="attachBtn" type="button" disabled aria-label="添加图片" title="添加图片">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <button class="send" id="sendBtn" type="button" disabled aria-label="发送" title="发送">
              <svg id="sendArrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
              <span class="send-stop" id="sendStopLabel" hidden>停止</span>
            </button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script src="chat.js"></script>
</body>
</html>

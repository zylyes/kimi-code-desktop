<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>原生聊天原型（ACP 实验）</title>
<link rel="stylesheet" href="kimi-theme.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { overflow: hidden; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* 内容列：居中、限宽 768px、左右留白 16px */
  .col {
    width: 100%;
    max-width: 768px;
    margin: 0 auto;
    padding-left: 16px;
    padding-right: 16px;
  }

  /* ---------- 顶部状态条 ---------- */
  .statusbar { flex: none; padding: 10px 0; }
  .statusbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    color: var(--label-tertiary);
  }
  .status-left { display: flex; align-items: center; gap: 8px; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.connecting { background: var(--label-quaternary); animation: breathe 1.4s ease-in-out infinite; }
  .dot.ready { background: var(--color-success); }
  .dot.busy { background: var(--color-success); animation: breathe 1.4s ease-in-out infinite; }
  .dot.error { background: var(--color-error); }
  .dot.exited { background: var(--label-quaternary); }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  .status-right {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
  }
  .status-right span { overflow: hidden; text-overflow: ellipsis; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ---------- 消息列表 ---------- */
  .messages { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .messages-inner {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-top: 8px;
    padding-bottom: 20px;
  }

  /* 用户消息：右侧气泡 */
  .msg-user {
    align-self: flex-end;
    max-width: 75%;
    padding: 10px 14px;
    background: var(--bg-secondary);
    border: 1px solid var(--separator);
    border-radius: var(--radius-card);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* assistant 消息：左侧无气泡纯文本 */
  .msg-assistant { align-self: stretch; min-width: 0; }
  .assistant-text {
    color: var(--label-primary);
    font-size: 16px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 每轮思考：折叠区，有内容时才展示 */
  .thought { margin-bottom: 8px; }
  .thought summary {
    display: inline-flex;
    align-items: center;
    font-size: 12.5px;
    color: var(--label-tertiary);
    cursor: pointer;
    user-select: none;
  }
  .thought-body {
    margin-top: 6px;
    max-height: 240px;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.6;
    color: var(--label-tertiary);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ---------- 工具调用卡片：左侧 2px 色条 + 等宽小字，状态点复用 .dot 色系 ---------- */
  .tool-card {
    margin: 8px 0;
    padding: 8px 12px;
    border-left: 2px solid var(--label-quaternary);
    border-radius: 8px;
    background: var(--bg-secondary);
    font-size: 12.5px;
    color: var(--label-secondary);
  }
  .tool-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tool-dot { width: 6px; height: 6px; }
  .tool-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--label-primary);
  }
  .tool-kind {
    flex: none;
    padding: 1px 6px;
    border: 1px solid var(--separator);
    border-radius: 6px;
    font-size: 11px;
    color: var(--label-tertiary);
  }
  .tool-status { flex: none; font-size: 11.5px; color: var(--label-tertiary); }
  .tool-detail summary {
    display: inline-flex;
    align-items: center;
    margin-top: 6px;
    font-size: 12px;
    color: var(--label-tertiary);
    cursor: pointer;
    user-select: none;
  }
  .tool-detail-body,
  .tool-output {
    margin-top: 6px;
    max-height: 200px;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.6;
    color: var(--label-tertiary);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 系统提示（如权限请求取消、发送失败） */
  .msg-system {
    align-self: stretch;
    text-align: center;
    font-size: 12px;
    color: var(--label-tertiary);
  }

  /* ---------- 底部输入区 ---------- */
  .bottom { flex: none; padding: 8px 0 16px; }

  /* 错误提示条：输入区上方 */
  .error-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--color-error);
  }
  .error-bar[hidden] { display: none; }
  .error-text { flex: 1; min-width: 0; word-break: break-word; line-height: 1.5; }
  .error-bar .btn { flex: none; padding: 4px 14px; font-size: 12px; }

  /* 输入容器：对齐官网 .chat-editor-content */
  .composer {
    background: var(--bg-secondary);
    border: 1px solid var(--separator);
    border-radius: var(--radius-input);
    box-shadow: var(--shadow-card);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .composer:focus-within { border-color: var(--label-quaternary); }
  .composer textarea {
    width: 100%;
    min-height: 24px;
    max-height: 170px;
    padding: 0;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--label-primary);
    font-family: inherit;
    font-size: 16px;
    line-height: 24px;
    overflow-y: hidden;
  }
  .composer textarea::placeholder { color: var(--label-quaternary); }
  .composer textarea:disabled { color: var(--label-tertiary); }
  .composer-actions { display: flex; justify-content: flex-end; }

  /* 圆形发送按钮：亮色下深底浅箭头，暗色下随令牌自动反转 */
  .send {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: var(--label-primary);
    color: var(--bg-ground);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .send:not(:disabled):hover { opacity: 0.85; }
  .send:disabled { opacity: 0.3; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    .dot.connecting, .dot.busy { animation: none; }
    .send { transition: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <!-- 顶部状态条 -->
    <header class="statusbar">
      <div class="col statusbar-row">
        <div class="status-left">
          <span class="dot connecting" id="statusDot" aria-hidden="true"></span>
          <span id="statusText">正在连接…</span>
        </div>
        <div class="status-right">
          <span id="agentInfo" hidden></span>
          <span id="sessionInfo" class="mono" hidden></span>
          <span id="commandsInfo" hidden></span>
        </div>
      </div>
    </header>

    <!-- 消息列表 -->
    <main class="messages" id="messages">
      <div class="col messages-inner" id="messagesInner"></div>
    </main>

    <!-- 底部：错误提示条 + 输入区 -->
    <footer class="bottom">
      <div class="col bottom-inner">
        <div class="error-bar" id="errorBar" hidden>
          <span class="error-text" id="errorText" role="alert"></span>
          <button class="btn btn-secondary" id="retryBtn" type="button">重试</button>
        </div>
        <div class="composer">
          <textarea id="input" rows="1" placeholder="给 Kimi 发送消息，Enter 发送，Shift+Enter 换行" aria-label="消息输入框" spellcheck="false" disabled></textarea>
          <div class="composer-actions">
            <button class="send" id="sendBtn" type="button" disabled aria-label="发送" title="发送">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script src="chat.js"></script>
</body>
</html>

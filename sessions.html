<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>Kimi Code Desktop · 会话</title>
<link rel="stylesheet" href="kimi-theme.css" />
<style>
  /* 主题令牌全部来自共享主题样式表；状态色纪律：仅成功/错误用点缀色，其余一律灰阶 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { overflow: hidden; }
  .mono { font-family: var(--font-mono); }

  .app { display: flex; height: 100vh; }

  /* ---------- 左侧会话导航 ---------- */
  .sidebar {
    width: 288px;
    flex-shrink: 0;
    border-right: 1px solid var(--separator);
    display: flex;
    flex-direction: column;
    background: var(--bg-primary);
  }
  .side-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 14px 10px;
  }
  .side-title { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
  .side-tools { display: flex; gap: 6px; }
  .icon-btn:disabled { opacity: 0.5; cursor: default; }
  .icon-btn .plus { font-size: 16px; line-height: 1; font-weight: 600; }

  /* 新会话权限模式控件 */
  .perm-ctl {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 8px;
    border: 1px solid var(--separator);
    border-radius: var(--radius-sm);
    background: var(--bg-secondary);
    color: var(--label-tertiary);
    font-size: 12px;
  }
  .perm-ctl select {
    max-width: 118px;
    border: none;
    background: transparent;
    color: var(--label-primary);
    font-size: 12px;
    font-family: inherit;
    outline: none;
    cursor: pointer;
  }
  .perm-ctl select option { background: var(--bg-primary); color: var(--label-primary); }
  .perm-ctl .perm-plan {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    user-select: none;
  }
  .perm-ctl .perm-plan input { accent-color: var(--label-primary); margin: 0; }

  .search-wrap { padding: 0 14px 10px; }
  #search { width: 100%; }

  .list {
    flex: 1;
    overflow-y: auto;
    list-style: none;
    padding: 2px 8px 8px;
  }
  .item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 10px;
    margin-bottom: 2px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: transparent;
    color: var(--label-primary);
    font-family: inherit;
    cursor: pointer;
    animation: rise 0.25s ease both;
  }
  .item:hover { background: var(--bg-secondary-hover); }
  .item[aria-selected="true"] {
    background: var(--bg-secondary-active);
    border-color: var(--separator);
  }
  .item:focus-visible { outline-offset: -1px; }
  .item-title {
    display: block;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-title .untitled { color: var(--label-tertiary); font-weight: 400; }
  .item-dir {
    display: block;
    margin-top: 3px;
    font-size: 11px;
    color: var(--label-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 5px;
    font-size: 11px;
    color: var(--label-tertiary);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--label-quaternary); flex-shrink: 0; }
  .dot.run { background: var(--color-success); }
  .dot.arc { background: var(--label-quaternary); }
  .dot.err { background: var(--color-error); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .empty {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    text-align: center;
    color: var(--label-tertiary);
    font-size: 12px;
    line-height: 1.7;
  }
  .empty.show { display: flex; }
  .empty .link {
    color: var(--label-tertiary);
    background: none;
    border: none;
    border-bottom: 1px solid transparent;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
  }
  .empty .link:hover { color: var(--label-primary); border-bottom-color: var(--label-primary); }

  .side-foot {
    padding: 9px 14px;
    border-top: 1px solid var(--separator);
    font-size: 11px;
    color: var(--label-tertiary);
  }

  /* ---------- 右侧详情 ---------- */
  .detail {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--label-tertiary);
    font-size: 13px;
    text-align: center;
    padding: 24px;
  }
  .placeholder .mark {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--bg-secondary);
    border: 1px solid var(--separator);
    color: var(--label-tertiary);
    font-size: 20px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 6px;
  }
  .placeholder .hint { font-size: 12px; }

  .panel {
    padding: 26px 32px 32px;
    max-width: 720px;
    animation: rise 0.2s ease both;
  }
  .panel-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }
  .panel-head h1 {
    flex: 1;
    min-width: 200px;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.4;
    word-break: break-all;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    padding: 3px 10px;
    border: 1px solid var(--separator);
    border-radius: var(--radius-pill);
    font-size: 11px;
    color: var(--label-tertiary);
    white-space: nowrap;
  }
  .badge.run {
    color: var(--color-success);
    border-color: color-mix(in srgb, var(--color-success) 40%, transparent);
    background: color-mix(in srgb, var(--color-success) 12%, transparent);
  }
  .badge.arc { color: var(--label-quaternary); }
  .badge.err {
    color: var(--color-error);
    border-color: color-mix(in srgb, var(--color-error) 40%, transparent);
    background: color-mix(in srgb, var(--color-error) 12%, transparent);
  }

  .meta {
    margin-top: 22px;
    overflow: hidden;
  }
  .meta-row {
    display: flex;
    gap: 16px;
    padding: 11px 14px;
    font-size: 13px;
  }
  .meta-row + .meta-row { border-top: 1px solid var(--separator); }
  .meta-row dt { width: 64px; flex-shrink: 0; color: var(--label-tertiary); font-size: 12px; padding-top: 1px; }
  .meta-row dd {
    flex: 1;
    word-break: break-all;
    user-select: text;
    line-height: 1.5;
  }
  .meta-row dd.mono { font-size: 12px; }

  .prompt-box { margin-top: 16px; }
  .prompt-label { font-size: 12px; color: var(--label-tertiary); margin-bottom: 8px; }
  .prompt {
    padding: 12px 14px;
    border: 1px solid var(--separator);
    border-radius: 12px;
    background: var(--bg-secondary);
    font-size: 12px;
    line-height: 1.7;
    color: var(--label-primary);
    white-space: pre-wrap;
    word-break: break-all;
    user-select: text;
    max-height: 160px;
    overflow-y: auto;
  }
  .prompt.none { color: var(--label-tertiary); }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  /* 按钮主体沿用共享主题的 .btn / .btn-primary / .btn-secondary / .btn-danger，此处仅补间距与悬停态 */
  .actions .btn { gap: 8px; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-secondary:hover { background: var(--bg-secondary-hover); border-color: var(--separator-hover); }
  .btn-danger:hover { border-color: var(--color-error); background: color-mix(in srgb, var(--color-error) 8%, transparent); }

  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    flex-shrink: 0;
    border: 2px solid var(--separator);
    border-top-color: var(--label-primary);
    border-radius: 50%;
    animation: rot 0.8s linear infinite;
  }
  .btn-primary .spinner {
    border-color: color-mix(in srgb, var(--bg-ground) 35%, transparent);
    border-top-color: var(--bg-ground);
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  .action-status {
    margin-top: 14px;
    font-size: 12px;
    min-height: 18px;
    line-height: 1.5;
    word-break: break-all;
  }
  .action-status.ok { color: var(--color-success); }
  .action-status.err { color: var(--color-error); }

  .bridge-warn {
    padding: 9px 14px;
    border-bottom: 1px solid var(--separator);
    background: var(--bg-primary);
    color: var(--label-secondary);
    font-size: 12px;
    line-height: 1.6;
  }

  @media (max-width: 720px) {
    .app { flex-direction: column; }
    .sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--separator);
      max-height: 44vh;
    }
    .panel { padding: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .item, .panel { animation: none; }
    .spinner { animation-duration: 1.6s; }
  }
</style>
</head>
<body>
  <!-- 无边框窗口顶部拖拽条（样式见 kimi-theme.css #kcd-drag-strip） -->
  <div id="kcd-drag-strip" aria-hidden="true"></div>
  <div class="app">
    <aside class="sidebar" aria-label="会话导航">
      <div class="side-head">
        <div class="side-title">会话</div>
        <div class="side-tools">
          <button class="icon-btn" id="refreshBtn" type="button" aria-label="刷新会话列表" title="刷新会话列表">刷新</button>
          <span class="perm-ctl" title="新会话的权限模式（仅对本次创建生效）">
            <select id="permMode" aria-label="新会话权限模式">
              <option value="">保持当前配置</option>
              <option value="manual">manual（每次询问）</option>
              <option value="yolo">yolo（自动放行非破坏性操作）</option>
              <option value="auto">auto（完全自动）</option>
            </select>
            <label class="perm-plan" title="以计划模式创建（仅对本次创建生效）"><input type="checkbox" id="permPlan" /> Plan</label>
          </span>
          <button class="icon-btn" id="createBtn" type="button" aria-label="在目录中新建会话" title="在目录中新建会话"><span class="plus" aria-hidden="true">+</span></button>
          <button class="icon-btn" id="settingsBtn" type="button" aria-label="设置" title="设置"><span aria-hidden="true">⚙</span></button>
        </div>
      </div>
      <div class="search-wrap">
        <input type="search" class="input" id="search" placeholder="搜索标题或目录…" aria-label="搜索会话" spellcheck="false" />
      </div>
      <ul class="list" id="sessionList" role="listbox" aria-label="会话列表"></ul>
      <div class="empty" id="emptyState"></div>
      <div class="side-foot" id="countLabel">正在加载…</div>
    </aside>

    <main class="detail" aria-label="会话详情">
      <div class="bridge-warn" id="bridgeWarn" hidden>
        未检测到桌面桥接接口（window.kimiDesktop），当前页面无法执行任何操作。
      </div>
      <div class="placeholder" id="placeholder">
        <div class="mark" aria-hidden="true">K</div>
        <div>从左侧选择一个会话查看详情</div>
        <div class="hint">或点击 + 在指定目录中开始新会话</div>
      </div>
      <section class="panel" id="panel" hidden>
        <div class="panel-head">
          <h1 id="dTitle"></h1>
          <span class="badge" id="dStatus"><span class="dot" aria-hidden="true"></span><span id="dStatusText"></span></span>
        </div>
        <dl class="meta card">
          <div class="meta-row">
            <dt>工作目录</dt>
            <dd class="mono" id="dWorkDir"></dd>
          </div>
          <div class="meta-row">
            <dt>更新时间</dt>
            <dd id="dUpdated"></dd>
          </div>
        </dl>
        <div class="prompt-box">
          <div class="prompt-label">最近提示</div>
          <div class="prompt mono" id="dPrompt"></div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="resumeBtn" type="button" aria-label="恢复此会话" title="恢复此会话，继续之前的对话">恢复会话</button>
          <button class="btn btn-secondary" id="nativeChatBtn" type="button" aria-label="在原生聊天窗中恢复此会话" title="在 ACP 原生聊天窗中恢复此会话（实验）">原生聊天</button>
          <button class="btn btn-secondary" id="exportBtn" type="button" aria-label="导出此会话为 ZIP 压缩包" title="导出此会话为 ZIP 压缩包">导出 ZIP</button>
          <button class="btn btn-secondary" id="visBtn" type="button" aria-label="打开此会话的可视化视图" title="在新窗口中打开此会话的可视化视图">打开可视化</button>
          <button class="btn btn-secondary" id="exportMdBtn" type="button" aria-label="导出此会话为 Markdown 文件" title="解析会话记录并导出为 Markdown 文件">导出 Markdown</button>
          <button class="btn btn-secondary" id="monitorBtn" type="button" aria-label="打开此会话的子 Agent 任务监视器" title="在新窗口中查看子 Agent 活动与后台任务">任务监视</button>
          <button class="btn btn-secondary" id="archiveBtn" type="button" aria-label="归档此会话" title="归档此会话（服务端支持时可用）">归档</button>
          <button class="btn btn-danger" id="deleteBtn" type="button" aria-label="删除此会话" title="永久删除此会话（服务端支持时可用）">删除</button>
        </div>
        <div class="action-status" id="actionStatus" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script>
    const api = window.kimiDesktop;
    const $ = (id) => document.getElementById(id);

    const listEl = $('sessionList');
    const emptyEl = $('emptyState');
    const countEl = $('countLabel');
    const searchEl = $('search');
    const refreshBtn = $('refreshBtn');
    const createBtn = $('createBtn');
    const settingsBtn = $('settingsBtn');
    const placeholderEl = $('placeholder');
    const panelEl = $('panel');
    const resumeBtn = $('resumeBtn');
    const nativeChatBtn = $('nativeChatBtn');
    const exportBtn = $('exportBtn');
    const visBtn = $('visBtn');
    const exportMdBtn = $('exportMdBtn');
    const monitorBtn = $('monitorBtn');
    const archiveBtn = $('archiveBtn');
    const deleteBtn = $('deleteBtn');
    // 服务端能力（archive/delete 不支持时保持禁用）
    let caps = { archive: false, delete: false, models: false };
    const statusEl = $('actionStatus');

    let sessions = [];
    let selectedId = null;
    let query = '';

    if (!api) {
      $('bridgeWarn').hidden = false;
      refreshBtn.disabled = true;
      createBtn.disabled = true;
      searchEl.disabled = true;
      countEl.textContent = '桥接不可用';
    }

    /* ---------- 数据规范化：容忍不同字段命名 ---------- */
    function normalize(raw) {
      const s = raw || {};
      return {
        id: String(s.id || s.sessionId || s.session_id || ''),
        title: s.title || s.name || '',
        workDir: s.workDir || s.work_dir || s.cwd || '',
        sessionDir: s.sessionDir || s.session_dir || '',
        lastPrompt: s.lastPrompt || s.last_prompt || '',
        updatedAt: s.updatedAt || s.updated_at || s.lastActiveAt || s.last_active_at || s.mtime || null,
        status: String(s.status || s.state || '').toLowerCase(),
      };
    }

    function statusInfo(s) {
      if (/(run|active|busy|live)/.test(s.status)) return { cls: 'run', label: '运行中' };
      if (/archiv/.test(s.status)) return { cls: 'arc', label: '已归档' };
      if (/(err|fail)/.test(s.status)) return { cls: 'err', label: '异常' };
      return { cls: '', label: '空闲' };
    }

    /* ---------- 时间格式化 ---------- */
    function relTime(ts) {
      const d = new Date(ts);
      if (isNaN(d)) return '';
      const diff = Date.now() - d.getTime();
      if (diff < 0) return d.toLocaleString('zh-CN', { hour12: false });
      if (diff < 60e3) return '刚刚';
      if (diff < 3600e3) return Math.floor(diff / 60e3) + ' 分钟前';
      if (diff < 86400e3) return Math.floor(diff / 3600e3) + ' 小时前';
      if (diff < 7 * 86400e3) return Math.floor(diff / 86400e3) + ' 天前';
      return d.toLocaleDateString('zh-CN');
    }
    function fullTime(ts) {
      const d = new Date(ts);
      if (isNaN(d)) return '未知';
      return d.toLocaleString('zh-CN', { hour12: false }) + '（' + relTime(ts) + '）';
    }

    /* ---------- 列表渲染 ---------- */
    function filtered() {
      if (!query) return sessions;
      const q = query.toLowerCase();
      return sessions.filter((s) =>
        (s.title + ' ' + s.workDir + ' ' + s.lastPrompt).toLowerCase().includes(q)
      );
    }

    function showEmpty(kind) {
      listEl.hidden = true;
      emptyEl.classList.add('show');
      emptyEl.textContent = '';
      if (kind === 'loading') {
        const sp = document.createElement('span');
        sp.className = 'spinner';
        emptyEl.appendChild(sp);
        emptyEl.appendChild(document.createTextNode('正在加载会话…'));
      } else if (kind === 'none') {
        emptyEl.appendChild(document.createTextNode('还没有任何会话。'));
        const btn = document.createElement('button');
        btn.className = 'link';
        btn.type = 'button';
        btn.textContent = '在目录中新建会话';
        btn.setAttribute('aria-label', '在目录中新建会话');
        btn.title = '在目录中新建会话';
        btn.addEventListener('click', onCreate);
        emptyEl.appendChild(btn);
      } else if (kind === 'nomatch') {
        emptyEl.appendChild(document.createTextNode('没有匹配“' + query + '”的会话。'));
        const btn = document.createElement('button');
        btn.className = 'link';
        btn.type = 'button';
        btn.textContent = '清除搜索';
        btn.setAttribute('aria-label', '清除搜索条件');
        btn.title = '清除搜索条件';
        btn.addEventListener('click', () => {
          searchEl.value = '';
          query = '';
          renderList();
          searchEl.focus();
        });
        emptyEl.appendChild(btn);
      } else if (kind === 'error') {
        emptyEl.appendChild(document.createTextNode('会话列表加载失败。'));
        const btn = document.createElement('button');
        btn.className = 'link';
        btn.type = 'button';
        btn.textContent = '重试';
        btn.setAttribute('aria-label', '重新加载会话列表');
        btn.title = '重新加载会话列表';
        btn.addEventListener('click', loadSessions);
        emptyEl.appendChild(btn);
      }
    }

    function renderList() {
      const rows = filtered();
      listEl.textContent = '';
      emptyEl.classList.remove('show');
      listEl.hidden = false;

      if (!rows.length) {
        showEmpty(sessions.length ? 'nomatch' : 'none');
        countEl.textContent = sessions.length ? '0 / ' + sessions.length + ' 个会话' : '暂无会话';
        return;
      }

      rows.forEach((s, i) => {
        const info = statusInfo(s);
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.className = 'item';
        btn.type = 'button';
        btn.setAttribute('role', 'option');
        btn.setAttribute('aria-selected', String(s.id === selectedId));
        btn.title = s.title || s.workDir || s.id;
        btn.style.animationDelay = Math.min(i * 20, 200) + 'ms';
        btn.dataset.id = s.id;

        const title = document.createElement('span');
        title.className = 'item-title';
        if (s.title) title.textContent = s.title;
        else {
          const u = document.createElement('span');
          u.className = 'untitled';
          u.textContent = '未命名会话';
          title.appendChild(u);
        }

        const dir = document.createElement('span');
        dir.className = 'item-dir mono';
        dir.textContent = s.workDir || s.id;

        const meta = document.createElement('span');
        meta.className = 'item-meta';
        const dot = document.createElement('span');
        dot.className = 'dot' + (info.cls ? ' ' + info.cls : '');
        dot.setAttribute('aria-hidden', 'true');
        meta.appendChild(dot);
        meta.appendChild(document.createTextNode(info.label + ' · ' + (relTime(s.updatedAt) || '时间未知')));

        btn.appendChild(title);
        btn.appendChild(dir);
        btn.appendChild(meta);
        btn.addEventListener('click', () => selectSession(s.id));
        li.appendChild(btn);
        listEl.appendChild(li);
      });

      countEl.textContent = query
        ? rows.length + ' / ' + sessions.length + ' 个会话'
        : '共 ' + rows.length + ' 个会话';
    }

    /* ---------- 详情渲染 ---------- */
    function selectSession(id) {
      selectedId = id;
      const s = sessions.find((x) => x.id === id);
      listEl.querySelectorAll('.item').forEach((el) => {
        el.setAttribute('aria-selected', String(el.dataset.id === id));
      });
      if (!s) {
        panelEl.hidden = true;
        placeholderEl.hidden = false;
        return;
      }
      const info = statusInfo(s);
      placeholderEl.hidden = true;
      panelEl.hidden = false;
      // 重新触发入场动画
      panelEl.style.animation = 'none';
      void panelEl.offsetWidth;
      panelEl.style.animation = '';

      $('dTitle').textContent = s.title || '未命名会话';
      $('dStatus').className = 'badge' + (info.cls ? ' ' + info.cls : '');
      $('dStatus').querySelector('.dot').className = 'dot' + (info.cls ? ' ' + info.cls : '');
      $('dStatusText').textContent = info.label;
      $('dWorkDir').textContent = s.workDir || '未知';
      $('dUpdated').textContent = s.updatedAt ? fullTime(s.updatedAt) : '未知';
      const p = $('dPrompt');
      p.textContent = s.lastPrompt || '（暂无记录）';
      p.classList.toggle('none', !s.lastPrompt);
      statusEl.textContent = '';
      statusEl.className = 'action-status';
      setActionsEnabled(true);
    }

    /* ---------- 动作按钮：加载 / 成功 / 失败 ---------- */
    function setActionsEnabled(on) {
      resumeBtn.disabled = !on;
      nativeChatBtn.disabled = !on;
      exportBtn.disabled = !on;
      visBtn.disabled = !on;
      exportMdBtn.disabled = !on;
      monitorBtn.disabled = !on;
      archiveBtn.disabled = !on || !caps.archive;
      deleteBtn.disabled = !on || !caps.delete;
    }

    function report(kind, msg) {
      statusEl.className = 'action-status' + (kind ? ' ' + kind : '');
      statusEl.textContent = msg;
    }

    async function runAction(btn, busyText, fn, okText) {
      if (!selectedId) return;
      const original = btn.textContent;
      setActionsEnabled(false);
      btn.textContent = '';
      const sp = document.createElement('span');
      sp.className = 'spinner';
      sp.setAttribute('aria-hidden', 'true');
      btn.appendChild(sp);
      btn.appendChild(document.createTextNode(busyText));
      report('', '');
      try {
        const r = await fn(selectedId);
        if (r && r.ok === false) throw new Error(r.message || '操作未完成');
        btn.textContent = original;
        setActionsEnabled(true);
        report('ok', okText);
      } catch (e) {
        btn.textContent = original;
        setActionsEnabled(true);
        report('err', '操作失败：' + ((e && e.message) || e || '未知错误'));
      }
    }

    resumeBtn.addEventListener('click', () =>
      runAction(resumeBtn, '正在恢复…', (id) => api.resumeSession(id), '已发送恢复请求，会话即将继续。'));
    nativeChatBtn.addEventListener('click', () => {
      const s = sessions.find((x) => x.id === selectedId);
      if (s && !s.workDir) {
        report('err', '该会话缺少工作目录信息，无法用原生聊天打开。');
        return;
      }
      runAction(nativeChatBtn, '正在打开…', (id) => api.openInNativeChat(id), '已在原生聊天窗打开。');
    });
    exportBtn.addEventListener('click', () =>
      runAction(exportBtn, '正在导出…', (id) => api.exportSession(id), '导出完成，ZIP 已保存。'));
    visBtn.addEventListener('click', () =>
      runAction(visBtn, '正在打开…', (id) => api.visualiseSession(id), '可视化视图已打开。'));

    /* ---------- 导出 Markdown：成功显示路径与消息数，用户取消保持静默 ---------- */
    exportMdBtn.addEventListener('click', async () => {
      if (!selectedId || !api) return;
      if (typeof api.exportMarkdown !== 'function') {
        report('err', '当前桥接版本不支持 Markdown 导出。');
        return;
      }
      const original = exportMdBtn.textContent;
      setActionsEnabled(false);
      exportMdBtn.textContent = '';
      const sp = document.createElement('span');
      sp.className = 'spinner';
      sp.setAttribute('aria-hidden', 'true');
      exportMdBtn.appendChild(sp);
      exportMdBtn.appendChild(document.createTextNode('正在导出…'));
      report('', '');
      try {
        const r = await api.exportMarkdown(selectedId);
        if (r && r.ok) {
          report('ok', '已导出 ' + (r.messageCount != null ? r.messageCount : 0) + ' 条消息：' + (r.path || ''));
        } else if (r && r.cancelled) {
          report('', ''); // 用户在保存对话框中取消，不打扰
        } else {
          report('err', '导出失败：' + ((r && r.message) || '未知错误'));
        }
      } catch (e) {
        report('err', '导出失败：' + ((e && e.message) || e || '未知错误'));
      } finally {
        exportMdBtn.textContent = original;
        setActionsEnabled(true);
      }
    });

    /* ---------- 任务监视：主进程据 sessionDir 新开监视器窗口 ---------- */
    monitorBtn.addEventListener('click', async () => {
      if (!selectedId || !api) return;
      if (typeof api.openAgentsMonitor !== 'function') {
        report('err', '当前桥接版本不支持任务监视器。');
        return;
      }
      const s = sessions.find((x) => x.id === selectedId);
      if (!s || !s.sessionDir) {
        report('err', '无法打开任务监视器：该会话缺少 sessionDir 信息。');
        return;
      }
      try {
        const r = await api.openAgentsMonitor(s.sessionDir, s.title || '未命名会话');
        if (r && r.ok === false) throw new Error(r.message || '打开未完成');
        report('ok', '任务监视器已打开。');
      } catch (e) {
        report('err', '打开任务监视器失败：' + ((e && e.message) || e || '未知错误'));
      }
    });

    archiveBtn.addEventListener('click', () => {
      const s = sessions.find((x) => x.id === selectedId);
      const name = (s && s.title) || selectedId;
      if (!window.confirm('确定归档会话「' + name + '」吗？\n归档后将从列表移除，可通过 Web UI 恢复。')) return;
      runAction(archiveBtn, '正在归档…', async (id) => {
        const r = await api.archiveSession(id);
        if (r && r.ok) await loadSessions();
        return r;
      }, '会话已归档。');
    });
    deleteBtn.addEventListener('click', () => {
      const s = sessions.find((x) => x.id === selectedId);
      const name = (s && s.title) || selectedId;
      if (!window.confirm('确定永久删除会话「' + name + '」吗？\n此操作不可撤销！')) return;
      runAction(deleteBtn, '正在删除…', async (id) => {
        const r = await api.deleteSession(id);
        if (r && r.ok) await loadSessions();
        return r;
      }, '会话已删除。');
    });

    // 服务端能力探测：不支持的端点禁用对应按钮
    async function loadCaps() {
      if (!api || typeof api.getCaps !== 'function') return;
      try {
        const r = await api.getCaps();
        if (r && r.ok && r.caps) {
          caps = r.caps;
          archiveBtn.title = caps.archive ? '归档此会话' : '当前服务端不支持归档';
          deleteBtn.title = caps.delete ? '永久删除此会话' : '当前服务端不支持删除';
          if (!panelEl.hidden) setActionsEnabled(true);
        }
      } catch { /* 保持默认禁用 */ }
    }
    loadCaps();

    // 其他端删除/归档会话后自动刷新列表
    if (api && typeof api.onSessionChanged === 'function') {
      api.onSessionChanged(() => { loadCaps(); loadSessions(); });
    }

    async function onCreate() {
      if (!api) return;
      const original = createBtn.innerHTML;
      createBtn.disabled = true;
      createBtn.textContent = '';
      const sp = document.createElement('span');
      sp.className = 'spinner';
      sp.setAttribute('aria-hidden', 'true');
      createBtn.appendChild(sp);
      try {
        // 收集权限模式选项：仅在非空/勾选时透传，空对象则保持原有无参调用
        const permMode = $('permMode').value;
        const plan = $('permPlan').checked;
        const opts = {};
        if (permMode) opts.permissionMode = permMode;
        if (plan) opts.planMode = true;
        const r = Object.keys(opts).length
          ? await api.createSessionInDirectory(opts)
          : await api.createSessionInDirectory();
        if (r && r.ok === false) throw new Error(r.message || '创建未完成');
      } catch (e) {
        countEl.textContent = '创建失败：' + ((e && e.message) || e || '未知错误');
      } finally {
        createBtn.innerHTML = original;
        createBtn.disabled = false;
      }
    }
    createBtn.addEventListener('click', onCreate);

    settingsBtn.addEventListener('click', () => {
      if (!api || typeof api.showSetup !== 'function') return;
      api.showSetup();
    });

    /* ---------- 加载与刷新 ---------- */
    async function loadSessions() {
      if (!api) return;
      showEmpty('loading');
      try {
        const r = await api.getSessions();
        if (r && r.ok === false) throw new Error(r.message || '加载未完成');
        const list = Array.isArray(r) ? r : (r && Array.isArray(r.sessions) ? r.sessions : []);
        sessions = list.map(normalize);
        renderList();
      } catch (e) {
        sessions = [];
        showEmpty('error');
        countEl.textContent = '加载失败：' + ((e && e.message) || e || '未知错误');
      }
    }

    refreshBtn.addEventListener('click', async () => {
      if (!api) return;
      const original = refreshBtn.textContent;
      refreshBtn.disabled = true;
      refreshBtn.textContent = '';
      const sp = document.createElement('span');
      sp.className = 'spinner';
      sp.setAttribute('aria-hidden', 'true');
      refreshBtn.appendChild(sp);
      refreshBtn.appendChild(document.createTextNode('刷新'));
      try {
        const r = await api.refreshSessions();
        if (r && r.ok === false) throw new Error(r.message || '刷新未完成');
        let data = Array.isArray(r) ? r : (r && Array.isArray(r.sessions) ? r.sessions : null);
        if (!data) {
          const g = await api.getSessions();
          if (g && g.ok === false) throw new Error(g.message || '加载未完成');
          data = Array.isArray(g) ? g : (g && Array.isArray(g.sessions) ? g.sessions : []);
        }
        sessions = data.map(normalize);
        renderList();
        if (selectedId && !sessions.some((s) => s.id === selectedId)) {
          selectedId = null;
          panelEl.hidden = true;
          placeholderEl.hidden = false;
        } else if (selectedId) {
          selectSession(selectedId);
        }
      } catch (e) {
        countEl.textContent = '刷新失败：' + ((e && e.message) || e || '未知错误');
      } finally {
        refreshBtn.textContent = original;
        refreshBtn.disabled = false;
      }
    });

    /* ---------- 搜索与键盘导航 ---------- */
    searchEl.addEventListener('input', () => {
      query = searchEl.value.trim();
      renderList();
    });

    listEl.addEventListener('keydown', (e) => {
      if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) return;
      const items = Array.from(listEl.querySelectorAll('.item'));
      if (!items.length) return;
      e.preventDefault();
      let idx = items.indexOf(document.activeElement);
      if (e.key === 'Home') idx = 0;
      else if (e.key === 'End') idx = items.length - 1;
      else if (e.key === 'ArrowDown') idx = Math.min(idx + 1, items.length - 1);
      else idx = Math.max(idx - 1, 0);
      items[idx].focus();
      selectSession(items[idx].dataset.id);
    });

    loadSessions();
  </script>
</body>
</html>

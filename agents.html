<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>Kimi Code Desktop · 子 Agent 任务监视器</title>
<link rel="stylesheet" href="kimi-theme.css" />
<script src="menu-panel.js" defer></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* 头部使用 kimi-theme.css 统一 .app-topbar 组件（48px、bg-ground 无缝、整行拖拽），页面内不重定义 */
  /* .icon-btn 基础样式与 hover 由 kimi-theme.css 共享类提供；主题未收录 :disabled，本地保留 */
  .icon-btn:disabled { opacity: 0.5; cursor: default; }

  /* .bridge-warn 使用 kimi-theme.css 共享样式（error 点缀色警示条） */

  /* ---------- 主体 ---------- */
  .body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px 20px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--label-secondary);
    line-height: 1.6;
    margin-bottom: 12px;
  }
  .status.err { color: var(--color-error); }
  .summary {
    font-size: 12px;
    color: var(--label-secondary);
    margin-bottom: 12px;
  }

  /* ---------- Agent 卡片 ---------- */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 12px;
  }
  .card {
    padding: 14px 16px;
    animation: rise 0.25s ease both;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .card-id {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 9px;
    border: 1px solid var(--separator);
    border-radius: var(--radius-pill);
    font-size: 11px;
    color: var(--label-tertiary);
    white-space: nowrap;
    flex-shrink: 0;
  }
  /* 状态色纪律：仅 成功 / 失败 使用点缀色，其余状态（主 Agent / 运行中 / 已停止）沿用基础灰阶 */
  .badge.ok { color: var(--color-success); }
  .badge.err { color: var(--color-error); }

  .card-stats {
    margin-top: 8px;
    font-size: 12px;
    color: var(--label-secondary);
  }
  .card-times { margin-top: 8px; }
  .kv {
    display: flex;
    gap: 10px;
    font-size: 12px;
    line-height: 1.7;
  }
  .kv-label { width: 30px; flex-shrink: 0; color: var(--label-tertiary); }
  .kv-value { flex: 1; word-break: break-all; user-select: text; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .chip {
    padding: 2px 9px;
    border: 1px solid var(--separator);
    border-radius: var(--radius-pill);
    background: var(--bg-secondary);
    font-size: 11px;
    color: var(--label-secondary);
    white-space: nowrap;
  }

  .bad-warn {
    margin-top: 10px;
    font-size: 12px;
    color: var(--label-secondary);
  }

  /* ---------- 后台任务 ---------- */
  .tasks-section { margin-top: 20px; }
  .sec-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .tasks { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .task {
    border: 1px solid var(--separator);
    border-radius: var(--radius-sm);
    background: var(--bg-primary);
    padding: 12px 14px;
  }
  .task-head {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .task-id {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .task-desc {
    margin-top: 6px;
    font-size: 12px;
    color: var(--label-secondary);
    line-height: 1.6;
    word-break: break-all;
    user-select: text;
  }

  /* ---------- 空态 / 加载态 ---------- */
  /* 空态用 kimi-theme.css 共享 .notice；加载态用共享 .loading + .spinner；rot / rise 动画亦由主题提供，页面内不重定义 */
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }
</style>
</head>
<body>
  <!-- 无边框窗口顶部拖拽条（样式见 kimi-theme.css #kcd-drag-strip） -->
  <div id="kcd-drag-strip" aria-hidden="true"></div>
  <div class="app">
    <header class="app-topbar">
      <div class="brand"><span class="mark">K</span><span class="brand-name">Kimi Code</span></div>
      <span class="app-topbar-title">子 Agent 任务监视器</span>
      <span class="app-topbar-sub" id="sessionTitle">未命名会话</span>
      <div class="app-topbar-actions">
        <button class="icon-btn" id="refreshBtn" type="button" aria-label="重新扫描会话目录" title="重新扫描会话目录">刷新</button>
      </div>
    </header>
    <div class="bridge-warn" id="bridgeWarn" hidden>
      未检测到桌面桥接接口（window.kimiDesktop），当前页面无法执行任何操作。
    </div>
    <main class="body" aria-label="子 Agent 与后台任务">
      <div class="status" id="statusLine" hidden></div>
      <div class="summary" id="summaryLine" hidden></div>
      <div class="cards" id="agentCards"></div>
      <div class="notice" id="agentsEmpty" hidden>该会话暂无子 Agent 记录</div>
      <section class="tasks-section" id="tasksSection" hidden>
        <div class="sec-title">后台任务</div>
        <ul class="tasks" id="taskList"></ul>
      </section>
    </main>
  </div>

  <script>
    const api = window.kimiDesktop;
    const $ = (id) => document.getElementById(id);

    /* ---------- 入口参数：由主进程开窗时经 query 传入 ---------- */
    const params = new URLSearchParams(location.search);
    const sessionDir = params.get('dir') || '';
    const sessionTitle = params.get('title') || '';

    const refreshBtn = $('refreshBtn');
    const statusEl = $('statusLine');
    const summaryEl = $('summaryLine');
    const cardsEl = $('agentCards');
    const agentsEmptyEl = $('agentsEmpty');
    const tasksSectionEl = $('tasksSection');
    const taskListEl = $('taskList');

    $('sessionTitle').textContent = sessionTitle || '未命名会话';
    $('sessionTitle').title = sessionDir;

    if (!api) {
      $('bridgeWarn').hidden = false;
      refreshBtn.disabled = true;
    }

    /* ---------- 格式化辅助 ---------- */
    function fmtTime(ms) {
      if (!ms || typeof ms !== 'number') return '未知';
      const d = new Date(ms);
      if (isNaN(d)) return '未知';
      return d.toLocaleString('zh-CN', { hour12: false });
    }

    // 事件类型按出现频次降序取前 n 个
    function topEventTypes(eventTypes, n) {
      return Object.entries(eventTypes || {})
        .sort((a, b) => b[1] - a[1])
        .slice(0, n || 5);
    }

    function statusClass(status) {
      const s = String(status || '').toLowerCase();
      if (/(run|active|progress|busy)/.test(s)) return 'run';
      if (/(fail|err)/.test(s)) return 'err';
      // 成功类状态映射到 .badge.ok（var(--color-success)）；\bok\b 防止误匹配 broken 等词
      if (/(\bok\b|done|success|complet|finish)/.test(s)) return 'ok';
      if (/(stop|cancel|kill)/.test(s)) return 'warn';
      return '';
    }

    /* ---------- 状态行 ---------- */
    /* 加载态用 kimi-theme.css 共享 .loading（自带 spinner 排版）；错误/提示沿用本地 .status */
    function showStatus(kind, msg) {
      statusEl.className = kind === 'loading' ? 'loading' : 'status' + (kind ? ' ' + kind : '');
      statusEl.textContent = '';
      if (kind === 'loading') {
        const sp = document.createElement('span');
        sp.className = 'spinner';
        sp.setAttribute('aria-hidden', 'true');
        statusEl.appendChild(sp);
      }
      if (msg) statusEl.appendChild(document.createTextNode(msg));
      statusEl.hidden = !(kind || msg);
    }

    /* ---------- 渲染 ---------- */
    function kvRow(label, value) {
      const row = document.createElement('div');
      row.className = 'kv';
      const dt = document.createElement('span');
      dt.className = 'kv-label';
      dt.textContent = label;
      const dd = document.createElement('span');
      dd.className = 'kv-value';
      dd.textContent = value;
      row.appendChild(dt);
      row.appendChild(dd);
      return row;
    }

    function buildAgentCard(agent) {
      const card = document.createElement('div');
      card.className = 'card';

      const head = document.createElement('div');
      head.className = 'card-head';
      const idEl = document.createElement('span');
      idEl.className = 'card-id mono';
      idEl.textContent = agent.id || '(未知)';
      idEl.title = agent.id || '';
      head.appendChild(idEl);
      if (agent.isMain) {
        const badge = document.createElement('span');
        badge.className = 'badge main';
        badge.textContent = '主 Agent';
        head.appendChild(badge);
      }
      card.appendChild(head);

      const stats = document.createElement('div');
      stats.className = 'card-stats';
      stats.textContent = '消息 ' + (agent.messageCount || 0) + ' 条 · 事件 ' + (agent.eventCount || 0) + ' 个';
      card.appendChild(stats);

      const times = document.createElement('div');
      times.className = 'card-times';
      times.appendChild(kvRow('开始', fmtTime(agent.firstTime)));
      times.appendChild(kvRow('结束', fmtTime(agent.lastTime)));
      card.appendChild(times);

      const top = topEventTypes(agent.eventTypes, 5);
      if (top.length) {
        const chips = document.createElement('div');
        chips.className = 'chips';
        for (const pair of top) {
          const chip = document.createElement('span');
          chip.className = 'chip mono';
          chip.textContent = pair[0] + ' ×' + pair[1];
          chip.title = pair[0] + '：' + pair[1] + ' 个事件';
          chips.appendChild(chip);
        }
        card.appendChild(chips);
      }

      if (agent.badLines > 0) {
        const warn = document.createElement('div');
        warn.className = 'bad-warn';
        warn.textContent = '⚠ ' + agent.badLines + ' 行无法解析';
        card.appendChild(warn);
      }
      return card;
    }

    function buildTaskItem(task) {
      const li = document.createElement('li');
      li.className = 'task';
      const head = document.createElement('div');
      head.className = 'task-head';
      const idEl = document.createElement('span');
      idEl.className = 'task-id mono';
      idEl.textContent = task.id || '(未知任务)';
      idEl.title = task.id || '';
      head.appendChild(idEl);
      if (task.status) {
        const badge = document.createElement('span');
        badge.className = 'badge' + (statusClass(task.status) ? ' ' + statusClass(task.status) : '');
        badge.textContent = task.status;
        head.appendChild(badge);
      }
      li.appendChild(head);
      if (task.description) {
        const desc = document.createElement('div');
        desc.className = 'task-desc';
        desc.textContent = task.description;
        li.appendChild(desc);
      }
      return li;
    }

    function render(result) {
      const agents = Array.isArray(result.agents) ? result.agents : [];
      const tasks = Array.isArray(result.tasks) ? result.tasks : [];
      cardsEl.textContent = '';
      taskListEl.textContent = '';

      // 主 Agent 置顶展示，其余保持后端返回的时间顺序
      agentsEmptyEl.hidden = agents.length > 0;
      const ordered = agents.slice().sort((a, b) => (b.isMain ? 1 : 0) - (a.isMain ? 1 : 0));
      for (const agent of ordered) cardsEl.appendChild(buildAgentCard(agent));

      // 无后台任务时整个区域隐藏
      tasksSectionEl.hidden = tasks.length === 0;
      for (const task of tasks) taskListEl.appendChild(buildTaskItem(task));

      summaryEl.textContent = '共 ' + agents.length + ' 个 Agent · ' + tasks.length + ' 个后台任务';
      summaryEl.hidden = false;
    }

    /* ---------- 加载与刷新 ---------- */
    async function load() {
      if (!api) return;
      if (!sessionDir) {
        showStatus('err', '缺少会话目录参数（dir），无法扫描。');
        return;
      }
      showStatus('loading', '正在扫描会话目录…');
      summaryEl.hidden = true;
      try {
        const r = await api.scanSubagents(sessionDir);
        if (!r || r.ok === false) {
          throw new Error((r && (r.error || r.message)) || '扫描未完成');
        }
        showStatus('', '');
        render(r);
      } catch (e) {
        cardsEl.textContent = '';
        agentsEmptyEl.hidden = true;
        tasksSectionEl.hidden = true;
        summaryEl.hidden = true;
        showStatus('err', '加载失败：' + ((e && e.message) || e || '未知错误'));
      }
    }

    refreshBtn.addEventListener('click', async () => {
      if (!api) return;
      const original = refreshBtn.textContent;
      refreshBtn.disabled = true;
      refreshBtn.textContent = '';
      const sp = document.createElement('span');
      sp.className = 'spinner';
      sp.setAttribute('aria-hidden', 'true');
      refreshBtn.appendChild(sp);
      refreshBtn.appendChild(document.createTextNode('刷新'));
      try {
        await load();
      } finally {
        refreshBtn.textContent = original;
        refreshBtn.disabled = false;
      }
    });

    load();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<!-- 二维码以 data: URL 内联展示，img-src 需放行 data: -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>Kimi Code Desktop · 局域网访问</title>
<link rel="stylesheet" href="kimi-theme.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { overflow: hidden; }
  .mono { font-family: var(--font-mono); }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- 安全警示横幅 ---------- */
  /* 右侧预留 150px 避开右上角悬浮窗控，防止首行警示文字被窗控遮住 */
  .danger-banner {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px 150px 12px 18px;
    background: var(--bg-primary);
    border-bottom: 1px solid var(--separator);
    color: var(--label-secondary);
    font-size: 12px;
    line-height: 1.7;
    flex-shrink: 0;
  }
  .danger-banner .lead {
    font-weight: 700;
    color: var(--color-error);
    white-space: nowrap;
  }
  .danger-banner code {
    font-family: var(--font-mono);
    color: var(--label-primary);
  }

  /* ---------- 主体 ---------- */
  .body {
    flex: 1;
    overflow-y: auto;
    padding: 22px 24px 26px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; }
  .sub { margin-top: 6px; font-size: 12px; color: var(--label-secondary); line-height: 1.7; }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--label-secondary);
    line-height: 1.6;
    min-height: 18px;
    word-break: break-all;
  }
  .status.ok { color: var(--color-success); }
  .status.err { color: var(--color-error); }

  .bridge-warn {
    margin-top: 14px;
    padding: 9px 14px;
    border: 1px solid var(--separator);
    border-radius: var(--radius-sm);
    background: var(--bg-primary);
    color: var(--label-secondary);
    font-size: 12px;
    line-height: 1.6;
  }

  .port-line {
    margin-top: 16px;
    font-size: 12px;
    color: var(--label-secondary);
  }

  /* ---------- 未开启提示 ---------- */
  /* 卡片外观由主题 .card 提供（元素加 card 类）；改名 .lan-notice 以避开主题弹窗家族的 .notice */
  .lan-notice {
    margin-top: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: flex-start;
  }
  .notice-text {
    color: var(--label-primary);
    font-size: 13px;
    line-height: 1.7;
  }

  /* 按钮沿用主题样式表的 .btn 体系（含 .btn-primary），此处仅保留本页增量 */
  .btn { gap: 8px; }
  .btn-primary { font-weight: 600; }
  .btn-primary .spinner {
    border-color: var(--label-quaternary);
    border-top-color: var(--bg-ground);
  }

  /* ---------- 网卡卡片 ---------- */
  .qr-missing {
    margin-top: 14px;
    font-size: 12px;
    color: var(--label-secondary);
    line-height: 1.6;
  }
  .nic-card {
    margin-top: 14px;
    padding: 14px 16px;
    animation: rise 0.25s ease both;
  }
  .nic-ip {
    font-size: 14px;
    font-weight: 600;
  }
  .nic-url-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
  }
  .nic-url {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: var(--label-secondary);
    word-break: break-all;
    user-select: text;
    line-height: 1.6;
  }
  /* 二维码容器：图像本体由 qrcode 库生成为 data: URL，颜色不在此修改；
     容器用 bg-primary + separator 边框，内边距兼作静区保证扫码对比度 */
  .nic-qr {
    margin-top: 12px;
    width: 168px;
    height: 168px;
    padding: 8px;
    background: var(--bg-primary);
    border: 1px solid var(--separator);
    border-radius: var(--radius-sm);
    display: block;
  }
  .qr-hint {
    margin-top: 8px;
    font-size: 11px;
    color: var(--label-secondary);
  }

  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    flex-shrink: 0;
    border: 2px solid var(--separator);
    border-top-color: var(--label-primary);
    border-radius: 50%;
    animation: rot 0.8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .nic-card { animation: none; }
    .spinner { animation-duration: 1.6s; }
  }
</style>
</head>
<body>
  <!-- 无边框窗口顶部拖拽条（样式见 kimi-theme.css #kcd-drag-strip） -->
  <div id="kcd-drag-strip" aria-hidden="true"></div>
  <div class="app">
    <div class="danger-banner" role="alert">
      <span class="lead">⚠ 安全警示</span>
      <span>URL 中的 token 即完整访问凭证，仅在可信局域网使用，勿截图外传；严禁叠加 <code>--dangerous-bypass-auth</code>（会关闭全部鉴权）。</span>
    </div>
    <main class="body" aria-label="局域网访问设置">
      <div class="wrap">
        <h1>局域网访问</h1>
        <p class="sub">将 Web UI 暴露到局域网后，可用手机或其他电脑通过下方地址访问本机会话。</p>
        <div class="bridge-warn" id="bridgeWarn" hidden>
          未检测到桌面桥接接口（window.kimiDesktop），当前页面无法执行任何操作。
        </div>
        <div class="status" id="statusLine" hidden></div>
        <div id="content"></div>
      </div>
    </main>
  </div>

  <script>
    const api = window.kimiDesktop;
    const $ = (id) => document.getElementById(id);

    const statusEl = $('statusLine');
    const contentEl = $('content');

    if (!api) {
      $('bridgeWarn').hidden = false;
    }

    /* ---------- 状态行 ---------- */
    function showStatus(kind, msg) {
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
      statusEl.textContent = '';
      if (kind === 'loading') {
        const sp = document.createElement('span');
        sp.className = 'spinner';
        sp.setAttribute('aria-hidden', 'true');
        statusEl.appendChild(sp);
      }
      if (msg) statusEl.appendChild(document.createTextNode(msg));
      statusEl.hidden = !(kind || msg);
    }

    /* ---------- 数据整理：把 urls 与 qrDataUrls 按网卡配对 ---------- */
    function ipFromUrl(url) {
      const m = /https?:\/\/([^:/]+)/.exec(url || '');
      return m ? m[1] : '';
    }

    function collectNics(info) {
      const urls = Array.isArray(info.urls) ? info.urls : [];
      const qrs = Array.isArray(info.qrDataUrls) ? info.qrDataUrls : [];
      // 防御：urls 缺失时直接以 qrDataUrls 为准
      if (!urls.length && qrs.length) {
        return qrs.map((q) => ({
          ip: (q && q.ip) || ipFromUrl(q && q.url),
          url: (q && q.url) || '',
          dataUrl: (q && q.dataUrl) || '',
        })).filter((n) => n.url);
      }
      return urls.map((u) => {
        const url = typeof u === 'string' ? u : (u && u.url) || '';
        const qr = qrs.find((q) => q && (q.url === url || (q.ip && url.indexOf(q.ip) !== -1)));
        return {
          ip: (qr && qr.ip) || (typeof u === 'object' && u && u.ip) || ipFromUrl(url),
          url: url,
          dataUrl: (qr && qr.dataUrl) || '',
        };
      }).filter((n) => n.url);
    }

    /* ---------- 渲染 ---------- */
    function buildNicCard(nic) {
      const card = document.createElement('div');
      card.className = 'nic-card card';

      const ipEl = document.createElement('div');
      ipEl.className = 'nic-ip mono';
      ipEl.textContent = nic.ip || '未知网卡';
      card.appendChild(ipEl);

      const urlRow = document.createElement('div');
      urlRow.className = 'nic-url-row';
      const urlEl = document.createElement('span');
      urlEl.className = 'nic-url mono';
      urlEl.textContent = nic.url;
      urlRow.appendChild(urlEl);
      const copyBtn = document.createElement('button');
      copyBtn.className = 'icon-btn';
      copyBtn.type = 'button';
      copyBtn.textContent = '复制';
      copyBtn.setAttribute('aria-label', '复制 ' + (nic.ip || '') + ' 的访问地址');
      copyBtn.title = '复制完整 URL（含 token）';
      copyBtn.addEventListener('click', () => copyUrl(nic.url, copyBtn));
      urlRow.appendChild(copyBtn);
      card.appendChild(urlRow);

      if (nic.dataUrl) {
        const img = document.createElement('img');
        img.className = 'nic-qr';
        img.src = nic.dataUrl;
        img.alt = (nic.ip || '网卡') + ' 的访问二维码';
        card.appendChild(img);
        const hint = document.createElement('div');
        hint.className = 'qr-hint';
        hint.textContent = '手机扫码访问（需与本机处于同一局域网）';
        card.appendChild(hint);
      }
      return card;
    }

    function render(info) {
      contentEl.textContent = '';

      const portLine = document.createElement('div');
      portLine.className = 'port-line';
      portLine.textContent = '服务端口：' + (info.port != null ? info.port : '未知');
      contentEl.appendChild(portLine);

      if (!info.hostWildcard) {
        // 未监听 0.0.0.0：给出提示与一键开启入口
        const notice = document.createElement('div');
        notice.className = 'lan-notice card';
        const text = document.createElement('div');
        text.className = 'notice-text';
        text.textContent = '当前仅监听 127.0.0.1，局域网不可达';
        notice.appendChild(text);
        const btn = document.createElement('button');
        btn.className = 'btn btn-primary';
        btn.id = 'enableBtn';
        btn.type = 'button';
        btn.textContent = '一键开启局域网访问并重启';
        btn.addEventListener('click', onEnable);
        notice.appendChild(btn);
        contentEl.appendChild(notice);
        return;
      }

      const nics = collectNics(info);
      if (!nics.length) {
        const empty = document.createElement('div');
        empty.className = 'lan-notice card';
        const text = document.createElement('div');
        text.className = 'notice-text';
        text.textContent = '已监听局域网地址，但未检测到可用的网卡 URL。';
        empty.appendChild(text);
        contentEl.appendChild(empty);
        return;
      }

      // qrcode 模块缺失时主进程返回空 qrDataUrls，仅展示 URL
      const hasQr = Array.isArray(info.qrDataUrls) && info.qrDataUrls.length > 0;
      if (!hasQr) {
        const hint = document.createElement('div');
        hint.className = 'qr-missing';
        hint.textContent = '未生成二维码（qrcode 模块缺失），请手动复制 URL 访问。';
        contentEl.appendChild(hint);
      }
      for (const nic of nics) contentEl.appendChild(buildNicCard(nic));
    }

    /* ---------- 复制 ---------- */
    async function copyUrl(url, btn) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(url);
        } else {
          // 回退：临时 textarea + execCommand
          const ta = document.createElement('textarea');
          ta.value = url;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        btn.textContent = '已复制';
        setTimeout(() => { btn.textContent = '复制'; }, 1500);
      } catch (e) {
        showStatus('err', '复制失败：' + ((e && e.message) || e || '未知错误'));
      }
    }

    /* ---------- 一键开启 ---------- */
    async function onEnable() {
      if (!api || typeof api.lanEnable !== 'function') return;
      const btn = $('enableBtn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '';
        const sp = document.createElement('span');
        sp.className = 'spinner';
        sp.setAttribute('aria-hidden', 'true');
        btn.appendChild(sp);
        btn.appendChild(document.createTextNode('正在开启…'));
      }
      showStatus('', '');
      try {
        const r = await api.lanEnable();
        if (r && r.ok) {
          showStatus('ok', (r.message || '已开启局域网访问，正在重启服务…') + '（3 秒后自动刷新状态）');
          // 服务重启需要一点时间，3 秒后重新拉取监听状态与地址
          setTimeout(load, 3000);
          return;
        }
        throw new Error((r && (r.message || r.error)) || '操作未完成');
      } catch (e) {
        showStatus('err', '开启失败：' + ((e && e.message) || e || '未知错误'));
        if (btn) {
          btn.disabled = false;
          btn.textContent = '一键开启局域网访问并重启';
        }
      }
    }

    /* ---------- 加载 ---------- */
    async function load() {
      if (!api) return;
      showStatus('loading', '正在读取局域网状态…');
      try {
        const r = await api.lanInfo();
        if (!r || r.ok === false) {
          throw new Error((r && (r.message || r.error)) || '读取未完成');
        }
        showStatus('', '');
        render(r);
      } catch (e) {
        contentEl.textContent = '';
        showStatus('err', '加载失败：' + ((e && e.message) || e || '未知错误'));
      }
    }

    load();
  </script>
</body>
</html>

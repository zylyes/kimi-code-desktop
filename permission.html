<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Kimi 权限请求</title>
<link rel="stylesheet" href="kimi-theme.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    overflow: hidden;
    display: flex;
  }

  .app { display: flex; flex-direction: column; width: 100%; height: 100vh; }

  /* ---------- 顶栏 ---------- */
  .kind-chip {
    display: inline-block;
    max-width: 50%;
    padding: 3px 10px;
    border: 1px solid var(--separator);
    border-radius: var(--radius-pill);
    font-size: 11px;
    color: var(--label-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: none;
  }

  /* ---------- 主区域 ---------- */
  .main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 18px 18px;
  }

  .req { animation: rise 0.22s ease both; }

  .req-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
    word-break: break-word;
    outline: none;
  }
  .req-sub {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--label-secondary);
    line-height: 1.7;
  }

  /* ---------- 详情区 ---------- */
  .detail-wrap { margin-top: 14px; }
  .block-label {
    font-size: 11px;
    color: var(--label-tertiary);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }
  .detail {
    max-height: 260px;
    overflow: auto;
    padding: 10px 12px;
    border: 1px solid var(--separator);
    border-radius: 12px;
    background: var(--bg-secondary);
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--label-primary);
    white-space: pre-wrap;
    word-break: break-word;
    user-select: text;
  }
  .detail-trunc {
    margin-top: 6px;
    font-size: 11px;
    color: var(--label-tertiary);
  }

  /* ---------- 相关文件 ---------- */
  .locs-wrap { margin-top: 14px; }
  .locs { list-style: none; }
  .loc {
    padding: 3px 0;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--label-secondary);
    word-break: break-all;
    user-select: text;
  }

  /* ---------- 底栏 ---------- */
  .foot-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .foot-right { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }

  /* 主题 .btn 体系之上的窗口级补充（仅布局与 hover，不含颜色硬编码） */
  .btn-primary:hover:not(:disabled) { opacity: 0.88; }
  .btn-secondary:hover:not(:disabled) {
    background: var(--bg-secondary-hover);
    border-color: var(--separator-hover);
  }
  .btn-danger:hover:not(:disabled) {
    background: color-mix(in srgb, var(--color-error) 8%, var(--bg-primary));
    border-color: color-mix(in srgb, var(--color-error) 45%, transparent);
  }

  @media (max-width: 420px) {
    .main { padding: 4px 14px 14px; }
    .req-title { font-size: 15px; }
    .foot-right { width: 100%; }
    .foot-right .btn { flex: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .req { animation: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">K</span>
        <span class="brand-name">权限请求</span>
      </div>
      <span class="kind-chip" id="kindChip" hidden></span>
    </header>

    <div class="bridge-warn" id="bridgeWarn" hidden>
      未检测到桌面桥接接口（window.kimiPermission），当前窗口无法执行任何操作。
    </div>

    <main class="main" id="main">
      <div class="loading" id="loading">
        <span class="spinner" aria-hidden="true"></span>正在加载审批请求…
      </div>

      <section class="req" id="req" hidden>
        <h1 class="req-title" id="reqTitle" tabindex="-1"></h1>
        <p class="req-sub">Kimi 请求执行以下操作，请选择是否允许。</p>
        <div class="detail-wrap" id="detailWrap" hidden>
          <div class="block-label">详情</div>
          <pre class="detail" id="detail"></pre>
          <div class="detail-trunc" id="detailTrunc" hidden>内容过长，已截断显示</div>
        </div>
        <div class="locs-wrap" id="locsWrap" hidden>
          <div class="block-label">相关文件</div>
          <ul class="locs" id="locs"></ul>
        </div>
      </section>

      <div class="notice" id="notice" hidden></div>
    </main>

    <footer class="foot" id="foot">
      <div class="hint" id="hint" role="status" aria-live="polite"></div>
      <div class="foot-row">
        <button class="btn ghost" id="cancelBtn" type="button" title="取消该请求（Esc）">取消</button>
        <div class="foot-right" id="optBtns"></div>
      </div>
    </footer>
  </div>

  <script src="permission.js"></script>
</body>
</html>

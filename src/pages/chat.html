<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>原生聊天</title>
<link rel="stylesheet" href="../styles/kimi-theme.css" />
<script src="../main/menu-panel.js" defer></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { overflow: hidden; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* .icon-btn 基础样式与 hover 由 kimi-theme.css 共享类提供；主题未收录 :disabled，本地补齐（桥接不可用时禁用 Web UI 按钮） */
  .icon-btn:disabled { opacity: 0.5; cursor: default; }

  /* 内容列：居中、限宽 768px、左右留白 16px */
  .col {
    width: 100%;
    max-width: 768px;
    margin: 0 auto;
    padding-left: 16px;
    padding-right: 16px;
  }

  /* ---------- 状态点：顶栏连接状态与工具卡片状态共用（顶栏结构类 .app-topbar/.brand/.app-topbar-sub/.app-topbar-actions 见 kimi-theme.css） ---------- */
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.connecting { background: var(--label-quaternary); animation: breathe 1.4s ease-in-out infinite; }
  .dot.ready { background: var(--color-success); }
  .dot.busy { background: var(--color-success); animation: breathe 1.4s ease-in-out infinite; }
  .dot.error { background: var(--color-error); }
  .dot.exited { background: var(--label-quaternary); }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  /* ---------- 会话信息行：topbar 下方可折叠行，恢复会话时展示会话名与工作目录，缺省隐藏 ---------- */
  .sessionbar {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px 0 4px;
    font-size: 12px;
    color: var(--label-tertiary);
    min-width: 0;
  }
  .sessionbar[hidden] { display: none; }
  .session-title {
    flex: none;
    max-width: 50%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--label-secondary);
  }
  .session-workdir {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---------- 配置切换栏：模型/思考/模式三个下拉，数据来自 configOptions；select 走 .input 共享风格，本地仅收敛尺寸 ---------- */
  .configbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 0 10px;
    font-size: 12px;
    color: var(--label-tertiary);
  }
  .configbar[hidden] { display: none; }
  .config-item { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .config-item[hidden] { display: none; }
  .config-label { flex: none; }
  .config-select { max-width: 180px; padding: 4px 8px; font-size: 12px; }
  .config-select:disabled { color: var(--label-tertiary); opacity: 0.4; }

  /* ---------- 底部细状态栏：agent / 会话 / 命令计数，仅可见项之间以 · 分隔，不可拖拽 ---------- */
  .chat-statusbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 28px;
    padding: 0 14px;
    border-top: 1px solid var(--separator);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--label-tertiary);
    white-space: nowrap;
    overflow: hidden;
    -webkit-app-region: no-drag;
  }
  .chat-statusbar span { overflow: hidden; text-overflow: ellipsis; }
  .chat-statusbar > span:not([hidden]) ~ span:not([hidden])::before {
    content: '·';
    margin-right: 8px;
    color: var(--label-quaternary);
  }
  /* 三项全隐藏时整条收起，不留空栏 */
  .chat-statusbar:not(:has(> span:not([hidden]))) { display: none; }

  /* ---------- 消息列表 ---------- */
  .messages { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .messages-inner {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-top: 8px;
    padding-bottom: 20px;
  }

  /* 空态：消息列表为空（.messages-inner:empty）时纯 CSS 展示，首条内容一到即隐去，无需 JS 介入 */
  .chat-empty { display: none; }
  .messages-inner:empty ~ .chat-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 100%;
  }

  /* 消息与工具卡片入场：复用 kimi-theme.css 的 rise 关键帧，节点插入时上浮淡入一次 */
  .msg,
  .tool-card { animation: rise 0.25s ease both; }

  /* 用户消息：右侧气泡 */
  .msg-user {
    align-self: flex-end;
    max-width: 75%;
    padding: 10px 14px;
    background: var(--bg-secondary);
    border: 1px solid var(--separator);
    border-radius: var(--radius-card);
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 用户消息内图片：缩略图行 + 文本块（chat.js 带图发送时渲染 .msg-images/.msg-image-thumb/.msg-user-text） */
  .msg-images {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 6px;
  }
  .msg-images:last-child { margin-bottom: 0; }
  .msg-image-thumb {
    display: block;
    max-width: 160px;
    max-height: 160px;
    object-fit: cover;
    border-radius: var(--radius-sm);
  }

  /* assistant 消息：左侧无气泡纯文本 */
  .msg-assistant { align-self: stretch; min-width: 0; }
  .assistant-text {
    color: var(--label-primary);
    font-size: 16px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 每轮思考：折叠区，有内容时才展示 */
  .thought { margin-bottom: 8px; }
  .thought summary {
    display: inline-flex;
    align-items: center;
    font-size: 12px;
    color: var(--label-tertiary);
    cursor: pointer;
    user-select: none;
  }
  .thought summary:hover { color: var(--label-secondary); }
  .thought-body {
    margin-top: 6px;
    max-height: 240px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--label-tertiary);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ---------- 工具调用卡片：左侧 2px 色条 + 等宽小字，状态点复用 .dot 色系 ---------- */
  .tool-card {
    margin: 8px 0;
    padding: 8px 12px;
    border-left: 2px solid var(--label-quaternary);
    border-radius: var(--radius-sm);
    background: var(--bg-secondary);
    font-size: 12px;
    color: var(--label-secondary);
  }
  .tool-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tool-dot { width: 6px; height: 6px; }
  .tool-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--label-primary);
  }
  .tool-kind {
    flex: none;
    padding: 1px 6px;
    border: 1px solid var(--separator);
    border-radius: var(--radius-pill);
    font-size: 11px;
    color: var(--label-tertiary);
  }
  .tool-status { flex: none; font-size: 11px; color: var(--label-tertiary); }
  .tool-detail summary {
    display: inline-flex;
    align-items: center;
    margin-top: 6px;
    font-size: 12px;
    color: var(--label-tertiary);
    cursor: pointer;
    user-select: none;
  }
  .tool-detail summary:hover { color: var(--label-secondary); }
  /* detail 文本与输出摘要：等宽小字嵌块，亮暗两态均与卡片底色拉开一层 */
  .tool-detail-body,
  .tool-output {
    margin-top: 6px;
    max-height: 200px;
    overflow-y: auto;
    padding: 8px 10px;
    background: var(--bg-primary);
    border: 1px solid var(--separator);
    border-radius: var(--radius-sm);
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--label-tertiary);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 系统提示（如权限请求取消、发送失败） */
  .msg-system {
    align-self: stretch;
    text-align: center;
    font-size: 12px;
    color: var(--label-tertiary);
  }

  /* ---------- 底部输入区 ---------- */
  .bottom { flex: none; padding: 8px 0 16px; }

  /* 错误提示条：输入区上方 */
  .error-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--color-error);
  }
  .error-bar[hidden] { display: none; }
  .error-text { flex: 1; min-width: 0; word-break: break-word; line-height: 1.5; }
  .error-bar .btn { flex: none; padding: 4px 14px; font-size: 12px; }

  /* 输入容器：对齐官网 .chat-editor-content；position:relative 作为斜杠菜单浮层定位基准 */
  .composer {
    position: relative;
    background: var(--bg-secondary);
    border: 1px solid var(--separator);
    border-radius: var(--radius-input);
    box-shadow: var(--shadow-card);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .composer:focus-within { border-color: var(--label-quaternary); }
  .composer textarea {
    width: 100%;
    min-height: 24px;
    max-height: 170px;
    padding: 0;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--label-primary);
    font-family: inherit;
    font-size: 16px;
    line-height: 24px;
    overflow-y: hidden;
  }
  .composer textarea::placeholder { color: var(--label-quaternary); }
  .composer textarea:disabled { color: var(--label-tertiary); }

  /* 附件缩略图行：textarea 上方，chat.js 动态创建 .chip（img 缩略图 + .chip-remove 移除钮） */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chips[hidden] { display: none; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px;
    background: var(--bg-tertiary);
    border: 1px solid var(--separator);
    border-radius: var(--radius-sm);
  }
  .chip img {
    display: block;
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: var(--radius-sm);
  }
  .chip-remove {
    flex: none;
    width: 20px;
    height: 20px;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--label-tertiary);
    font-family: inherit;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .chip-remove:hover { color: var(--label-primary); }

  /* 斜杠命令浮层：绝对定位于输入容器上方，chat.js 往其中渲染 button.slash-item，高亮态加 .active */
  .slash-menu {
    position: absolute;
    bottom: 100%;
    left: 0;
    right: 0;
    z-index: 10;
    margin-bottom: 6px;
    max-height: 260px;
    overflow-y: auto;
    padding: 4px;
    background: var(--bg-tertiary);
    border: 1px solid var(--separator);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
  }
  .slash-menu[hidden] { display: none; }
  .slash-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    padding: 8px 12px;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    font-size: 13px;
    color: var(--label-primary);
  }
  .slash-item:hover,
  .slash-item.active { background: var(--bg-tertiary-hover); }
  .slash-name {
    flex: none;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--label-primary);
  }
  .slash-desc {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    color: var(--label-tertiary);
  }
  .slash-hint {
    flex: none;
    max-width: 40%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--label-quaternary);
  }

  .composer-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  /* 圆形附件按钮：发送按钮左侧，透明底，仅图标着色 */
  .attach {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--label-tertiary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.15s ease, background-color 0.15s ease;
  }
  .attach:not(:disabled):hover { color: var(--label-primary); background: var(--bg-secondary-hover); }
  .attach:disabled { opacity: 0.4; cursor: default; }

  /* 圆形发送按钮：亮色下深底浅箭头，暗色下随令牌自动反转 */
  .send {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: var(--label-primary);
    color: var(--bg-ground);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .send:not(:disabled):hover { opacity: 0.85; }
  .send:disabled { opacity: 0.4; cursor: default; }
  /* busy 态停止按钮：同一节点换文案，由圆形变为胶囊 */
  .send.stop-mode { width: auto; height: 32px; padding: 0 12px; border-radius: var(--radius-pill); font-size: 13px; }
  .send-stop { white-space: nowrap; }

  /* ================= Markdown 排版 ================= */
  .assistant-text { white-space: normal; } /* 覆盖 pre-wrap，让 Markdown 块级元素换行 */
  .assistant-text p { margin: 0.5em 0; }
  .assistant-text p:first-child { margin-top: 0; }
  .assistant-text h1, .assistant-text h2, .assistant-text h3,
  .assistant-text h4, .assistant-text h5, .assistant-text h6 {
    margin: 0.8em 0 0.4em;
    line-height: 1.3;
    color: var(--label-primary);
  }
  .assistant-text h1 { font-size: 1.6em; }
  .assistant-text h2 { font-size: 1.35em; }
  .assistant-text h3 { font-size: 1.2em; }
  .assistant-text h4 { font-size: 1.1em; }
  .assistant-text h5, .assistant-text h6 { font-size: 1em; }
  .assistant-text ul, .assistant-text ol { padding-left: 1.8em; margin: 0.4em 0; }
  .assistant-text li { margin: 0.2em 0; }
  .assistant-text li > ul, .assistant-text li > ol { margin: 0; }
  .assistant-text blockquote {
    margin: 0.5em 0;
    padding: 0.3em 1em;
    border-left: 3px solid var(--separator);
    color: var(--label-secondary);
  }
  .assistant-text hr { margin: 1em 0; border: none; height: 1px; background: var(--separator); }
  .assistant-text table {
    border-collapse: collapse;
    margin: 0.6em 0;
    width: 100%;
    font-size: 14px;
  }
  .assistant-text th, .assistant-text td {
    border: 1px solid var(--separator);
    padding: 6px 10px;
    text-align: left;
  }
  .assistant-text th {
    background: var(--bg-secondary);
    font-weight: 600;
    color: var(--label-primary);
  }
  .assistant-text td { color: var(--label-secondary); }
  .assistant-text tr:nth-child(even) td { background: var(--bg-secondary); }
  .assistant-text code {
    padding: 2px 6px;
    background: var(--bg-secondary);
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.9em;
    color: var(--label-primary);
  }
  .assistant-text pre {
    position: relative;
    margin: 0.6em 0;
    padding: 12px 14px;
    background: var(--bg-secondary);
    border: 1px solid var(--separator);
    border-radius: var(--radius-sm);
    overflow-x: auto;
  }
  .assistant-text pre code {
    padding: 0;
    background: transparent;
    border-radius: 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--label-primary);
  }
  .assistant-text a { color: var(--label-primary); text-decoration: underline; }
  .assistant-text a:hover { opacity: 0.8; }
  .assistant-text img { max-width: 100%; border-radius: var(--radius-sm); }
  .assistant-text del { color: var(--label-tertiary); }
  .assistant-text input[type=checkbox] { margin-right: 6px; pointer-events: none; }

  /* 代码块复制按钮 */
  .kcd-copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 2px 8px;
    border: 1px solid var(--separator);
    border-radius: 4px;
    background: var(--bg-primary);
    color: var(--label-tertiary);
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 1;
  }
  .assistant-text pre:hover .kcd-copy-btn { opacity: 1; }
  .kcd-copy-btn:hover { background: var(--bg-secondary-hover); color: var(--label-primary); }

  /* 消息级操作栏 */
  .kcd-msg-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    justify-content: flex-end;
  }
  .kcd-msg-copy-btn {
    padding: 2px 10px;
    border: 1px solid var(--separator);
    border-radius: var(--radius-pill);
    background: transparent;
    color: var(--label-tertiary);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: color 0.15s ease, background-color 0.15s ease;
  }
  .kcd-msg-copy-btn:hover { color: var(--label-primary); background: var(--bg-secondary-hover); }

  /* ================= hljs 高亮色 — 映射到 CSS 变量，自动适配双主题 ================= */
  .hljs { color: var(--label-primary); background: transparent; }
  .hljs-comment, .hljs-quote { color: var(--label-tertiary); font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-subst { color: var(--label-primary); }
  .hljs-number, .hljs-literal, .hljs-variable, .hljs-template-variable, .hljs-tag .hljs-attr { color: var(--label-secondary); }
  .hljs-string, .hljs-doctag { color: var(--label-secondary); }
  .hljs-title, .hljs-section, .hljs-selector-id { color: var(--label-primary); font-weight: 600; }
  .hljs-type, .hljs-class .hljs-title { color: var(--label-primary); }
  .hljs-tag, .hljs-name, .hljs-attribute { color: var(--label-secondary); }
  .hljs-regexp, .hljs-link { color: var(--label-secondary); }
  .hljs-symbol, .hljs-bullet { color: var(--label-primary); }
  .hljs-built_in, .hljs-builtin-name { color: var(--label-primary); }
  .hljs-meta { color: var(--label-tertiary); }
  .hljs-deletion { background: rgba(255, 60, 50, 0.08); }
  .hljs-addition { background: rgba(50, 200, 80, 0.08); }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 600; }

  /* ================= Plan 卡片（消息区顶部 sticky） ================= */
  .plan-card-wrap {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 8px 0;
    background: var(--bg-ground);
  }
  .plan-card-wrap[hidden] { display: none; }
  .plan-card {
    padding: 10px 14px;
    border: 1px solid var(--separator);
    border-radius: var(--radius-card);
    background: var(--bg-secondary);
    font-size: 13px;
    color: var(--label-primary);
  }
  .plan-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .plan-card-header:hover { opacity: 0.8; }
  .plan-card-summary {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--label-primary);
  }
  .plan-card-summary .count { color: var(--label-tertiary); font-size: 12px; }
  .plan-card-toggle {
    flex: none;
    font-size: 12px;
    color: var(--label-tertiary);
    transition: transform 0.2s ease;
  }
  .plan-card-toggle.open { transform: rotate(180deg); }
  .plan-card-list {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 300px;
    overflow-y: auto;
  }
  .plan-card-list[hidden] { display: none; }
  .plan-card-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    line-height: 1.5;
    color: var(--label-primary);
  }
  .plan-card-item:hover { background: var(--bg-tertiary); }
  .plan-card-item .bullet {
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .plan-card-item .bullet.completed { background: var(--color-success); }
  .plan-card-item .bullet.in_progress { background: var(--color-warning); animation: breathe 1.4s ease-in-out infinite; }
  .plan-card-item .bullet.pending { background: var(--label-quaternary); }
  .plan-card-item .item-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .plan-card-item.completed .item-text {
    color: var(--label-tertiary);
    text-decoration: line-through;
    opacity: 0.6;
  }

  /* ================= TodoList 待办卡片 ================= */
  .kcd-todo-list {
    margin: 6px 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .kcd-todo-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 13px;
    color: var(--label-primary);
    cursor: default;
  }
  .kcd-todo-item:hover { background: var(--bg-secondary); }
  .kcd-todo-done {
    color: var(--label-tertiary);
    text-decoration: line-through;
    opacity: 0.6;
  }
  .kcd-todo-done:hover { opacity: 0.8; }
  .kcd-todo-collapsed {
    padding: 4px 8px;
    font-size: 12px;
    color: var(--label-tertiary);
    cursor: pointer;
  }
  .kcd-todo-collapsed:hover { color: var(--label-secondary); }
  .kcd-todo-empty {
    padding: 4px 8px;
    font-size: 12px;
    color: var(--label-tertiary);
    font-style: italic;
  }

  @media (prefers-reduced-motion: reduce) {
    .dot.connecting, .dot.busy { animation: none; }
    .msg, .tool-card { animation: none; }
    .send { transition: none; }
  }
</style>
</head>
<body>
  <!-- 无边框窗口顶部拖拽条（样式见 kimi-theme.css #kcd-drag-strip） -->
  <div id="kcd-drag-strip" aria-hidden="true"></div>
  <div class="app">
    <!-- 统一头部（结构类 .app-topbar/.brand/.app-topbar-sub/.app-topbar-actions 见 kimi-theme.css，页面内不重定义） -->
    <header class="app-topbar">
      <div class="brand">
        <span class="mark">K</span>
        <span class="brand-name">Kimi Code</span>
      </div>
      <span class="dot connecting" id="statusDot" aria-hidden="true"></span>
      <span class="app-topbar-sub" id="statusText">正在连接…</span>
      <div class="app-topbar-actions">
        <button class="icon-btn" id="plainToggleBtn" type="button" title="切换纯文本/Markdown 渲染">纯文本</button>
        <button class="icon-btn" id="webuiBtn" type="button" title="在 Web UI 高级面板中打开">Web UI</button>
      </div>
    </header>

    <!-- 会话信息行：topbar 下方可折叠行，恢复会话时展示，缺省隐藏 -->
    <div class="col sessionbar" id="sessionBar" hidden>
      <span class="session-title" id="sessionTitle" hidden></span>
      <span class="session-workdir mono" id="workDir" hidden></span>
    </div>
    <!-- 配置切换栏：模型/思考/模式，数据来自 configOptions，某项缺失则隐藏对应项 -->
    <div class="col configbar" id="configBar" hidden>
      <label class="config-item" id="configItem-model" hidden>
        <span class="config-label">模型</span>
        <select class="config-select input" id="configSelect-model" aria-label="模型"></select>
      </label>
      <label class="config-item" id="configItem-thinking" hidden>
        <span class="config-label">思考</span>
        <select class="config-select input" id="configSelect-thinking" aria-label="思考"></select>
      </label>
      <label class="config-item" id="configItem-mode" hidden>
        <span class="config-label">模式</span>
        <select class="config-select input" id="configSelect-mode" aria-label="模式"></select>
      </label>
    </div>

    <!-- 消息列表 -->
    <main class="messages" id="messages">
      <!-- Plan 卡片：由 chat.js 动态控制显隐与内容，位于消息区顶部 sticky -->
      <div class="col plan-card-wrap" id="planCardWrap" hidden>
        <div class="plan-card">
          <div class="plan-card-header" id="planCardHeader">
            <span class="plan-card-summary" id="planCardSummary"></span>
            <span class="plan-card-toggle" id="planCardToggle">▼</span>
          </div>
          <div class="plan-card-list" id="planCardList" hidden></div>
        </div>
      </div>
      <div class="col messages-inner" id="messagesInner"></div>
      <!-- 空态：仅消息列表为空时经 .messages-inner:empty ~ .chat-empty 纯 CSS 显示（共享 .notice/.mark 组件），首条内容一到即隐去 -->
      <div class="col notice chat-empty">
        <span class="mark" aria-hidden="true">K</span>
        <span>给 Kimi 发送消息，开始新的对话</span>
      </div>
    </main>

    <!-- 底部：错误提示条 + 输入区 -->
    <footer class="bottom">
      <div class="col bottom-inner">
        <div class="error-bar" id="errorBar" hidden>
          <span class="error-text" id="errorText" role="alert"></span>
          <button class="btn btn-secondary" id="retryBtn" type="button">重试</button>
        </div>
        <div class="composer">
          <!-- 斜杠命令浮层：chat.js 渲染 button.slash-item，缺省隐藏 -->
          <div class="slash-menu" id="slashMenu" hidden></div>
          <!-- 附件缩略图行：chat.js 创建 .chip，缺省隐藏 -->
          <div class="chips" id="chips" hidden></div>
          <textarea id="input" rows="1" placeholder="给 Kimi 发送消息，Enter 发送，Shift+Enter 换行" aria-label="消息输入框" spellcheck="false" disabled></textarea>
          <div class="composer-actions">
            <button class="attach" id="attachBtn" type="button" disabled aria-label="添加图片" title="添加图片">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <button class="send" id="sendBtn" type="button" disabled aria-label="发送" title="发送">
              <svg id="sendArrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
              <span class="send-stop" id="sendStopLabel" hidden>停止</span>
            </button>
          </div>
        </div>
      </div>
    </footer>

    <!-- 底部细状态栏：agent / 会话 / 命令计数（自原顶部状态行迁入），· 分隔、不可拖拽 -->
    <div class="chat-statusbar">
      <span id="agentInfo" hidden></span>
      <span id="sessionInfo" class="mono" hidden></span>
      <span id="commandsInfo" hidden></span>
    </div>
  </div>

  <!-- 第三方 vendor 库：Markdown 解析、XSS 过滤、代码高亮 -->
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/dompurify.min.js"></script>
  <script src="vendor/highlight.bundle.js"></script>
  <!-- Markdown / 代码高亮渲染模块 -->
  <script src="chat-markdown.js"></script>
  <script src="chat.js"></script>
</body>
</html>

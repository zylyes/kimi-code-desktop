<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>Kimi Code Desktop</title>
<link rel="stylesheet" href="kimi-theme.css">
<script src="menu-panel.js" defer></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  /* 头部使用 kimi-theme.css 统一 .app-topbar 组件（48px、bg-ground 与窗口底色无缝、整行拖拽），页面内不重定义 */
  /* 内容区在顶栏之下填满剩余高度并保持居中加载页形态 */
  .splash {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { width: 420px; max-width: calc(100% - 48px); text-align: center; }
  /* 启动页大 logo（区别于主题 .brand 内的 28px .mark，独立命名避免冲突） */
  .splash-mark {
    width: 56px; height: 56px;
    margin: 0 auto 22px;
    border-radius: 14px;
    background: var(--label-primary);
    color: var(--bg-ground);
    font-size: 30px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(0.97); }
  }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.02em; }
  .sub { margin-top: 8px; font-size: 13px; color: var(--label-secondary); }
  /* 加载动画复用共享 .spinner 组件（配色/旋转动画来自 kimi-theme.css），此处仅放大尺寸与调整间距 */
  .splash-spinner {
    margin-top: 24px;
    display: flex;
    justify-content: center;
  }
  .splash-spinner .spinner {
    width: 18px;
    height: 18px;
    border-width: 2px;
  }
  .log {
    margin-top: 26px;
    padding: 12px 14px;
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
    height: 120px;
    overflow: hidden;
    text-align: left;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.7;
    color: var(--label-tertiary);
    white-space: pre-wrap;
    word-break: break-all;
    user-select: text;
  }
  .actions { margin-top: 16px; font-size: 12px; }
  .actions a {
    color: var(--label-tertiary);
    cursor: pointer;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .actions a:hover { color: var(--label-primary); border-bottom-color: var(--label-quaternary); }
  @media (prefers-reduced-motion: reduce) {
    .splash-mark { animation: none; }
  }
</style>
</head>
<body>
  <!-- 无边框窗口顶部拖拽条（样式见 kimi-theme.css #kcd-drag-strip） -->
  <div id="kcd-drag-strip" aria-hidden="true"></div>
  <header class="app-topbar">
    <div class="brand"><span class="mark">K</span><span class="brand-name">Kimi Code</span></div>
  </header>
  <main class="splash">
    <div class="wrap">
      <div class="splash-mark">K</div>
      <h1>正在启动 Kimi Code Web 服务</h1>
      <p class="sub">自动运行 kimi web，捕获会话地址后进入工作台</p>
      <div class="splash-spinner"><span class="spinner" aria-hidden="true"></span></div>
      <div class="log" id="log">等待 CLI 输出…&#10;</div>
      <div class="actions">
        <a id="manual">启动失败？手动输入地址</a>
      </div>
    </div>
  </main>
  <script>
    const logEl = document.getElementById('log');
    const lines = [];
    function push(msg) {
      lines.push(msg);
      while (lines.length > 6) lines.shift();
      logEl.textContent = lines.join('\n');
    }
    if (window.kimiDesktop) {
      window.kimiDesktop.onLog(push);
      document.getElementById('manual').addEventListener('click', () => {
        window.kimiDesktop.showSetup();
      });
    }
  </script>
</body>
</html>
